# /etc/supervisor/conf.d/software-factory-horizon.conf
# Keeps Horizon (the queue workers, including agent runs) running.
#   sudo supervisorctl reread && sudo supervisorctl update

[program:software-factory-horizon]
process_name=%(program_name)s
command=php /srv/software-factory/artisan horizon
directory=/srv/software-factory
user=factory
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/srv/software-factory/storage/logs/horizon.log
stopwaitsecs=3700
stopasgroup=true
killasgroup=true
